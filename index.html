<style>
:root{--bg:#f3f2ef;--panel:#fff;--ink:#1b1b1b;--mute:#6b6b6b;--line:#dcdad5;--btn:#1b1b1b;--btnt:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--panel:#1e1e1e;--ink:#eee;--mute:#9a9a9a;--line:#333;--btn:#eee;--btnt:#141414;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--panel:#1e1e1e;--ink:#eee;--mute:#9a9a9a;--line:#333;--btn:#eee;--btnt:#141414;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:380px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow-y:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
aside h1{font-size:18px;margin:0 0 4px}aside p{margin:0 0 12px;color:var(--mute)}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600;padding:6px 0}
label{display:block;margin:8px 0 2px;color:var(--mute);font-size:12px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
input[type=color]{padding:2px;height:36px}input[type=checkbox]{width:auto}input[type=range]{padding:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #2f6fed;outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--ink);font-size:13px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px}
button.p{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.item{border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0}
.item .row3{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{width:56px;height:36px;border-radius:6px;border:2px solid var(--line);font-size:10px;display:flex;align-items:end;justify-content:center;padding:2px}
.sw.on{border-color:#2f6fed}
main{padding:24px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:794px;margin:0 auto 12px;padding:0 12px}
.paper{width:794px;max-width:none;margin:0 auto}.pg{position:relative;width:794px;height:1123px;padding:44px 48px;background:var(--pp);color:var(--pi);box-shadow:0 2px 20px rgba(0,0,0,.18);overflow:hidden;margin:0 0 20px}
.pg .bgi{position:absolute;inset:0;background-size:cover;background-position:center;opacity:var(--bgo)}
.pg>*:not(.bgi){position:relative}.pg>.pn{position:absolute!important;bottom:16px;left:0;right:0;text-align:center;font-size:11px;opacity:.6}.dv{border-top:1px solid var(--pl);margin-top:20px;padding-top:20px}table.it{table-layout:fixed}td.d{overflow-wrap:anywhere}
.paper hr{border:0;border-top:1px solid var(--pl);margin:20px 0}.paper a{color:inherit;text-decoration:none}.ic{display:flex;gap:14px;justify-content:center;margin-top:18px}.ic a{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}td.d{white-space:pre-line;word-break:break-word}.sn{width:52px}.mdl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.mdl>div{background:var(--panel);color:var(--ink);border-radius:10px;padding:18px;max-width:380px;width:100%;max-height:90vh;overflow:auto}.mdl button{margin:10px 8px 0 0}.brand{display:flex;align-items:center;gap:10px}
#home{max-width:720px;margin:0 auto;padding:0 14px 150px}
#hd{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}#hd b{flex:1;font-size:18px}#hl{cursor:pointer;display:flex}#hl.pp{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}.gr{font-size:20px;background:none;border:0}
.fb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}.fb button{margin-top:10px;width:100%}
.ch{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.ch button{white-space:nowrap;border-radius:16px;padding:6px 12px}.ch button.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.cd{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.r2{text-align:right}.bd{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#8884}.sPaid,.sApproved{background:#1e8e3e33;color:#1e8e3e}.sOverdue{background:#d9303033;color:#d93030}.sPartiallypaid{background:#e8710033;color:#e87100}.sPending{background:#1a73e833;color:#1a73e8}
.em{text-align:center;color:var(--mute);margin-top:60px}.sm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.sm div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--btn);color:var(--btnt);font-size:30px;border:0;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:6}
#nv{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}#nv button{flex:1;border:0;border-radius:0;background:none;padding:8px 2px;font-size:11px;color:var(--mute)}#nv button.on{color:var(--btn);font-weight:600}#nv span{display:block;font-size:20px}
#etop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:7;min-height:52px}#etop b{flex:1}#etop input,#etop select{width:auto;max-width:130px}
@media print{#home,#etop{display:none!important}}.dts{display:grid;gap:6px;margin-top:4px}.fl{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0}.fl img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:4px}label.fs{display:flex;justify-content:space-between;align-items:center}.sw2{display:flex;gap:4px;align-items:center;font-size:12px}.phr{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:6px}
.top{display:flex;justify-content:space-between;gap:24px}
.top img.logo{max-height:70px;max-width:200px;display:block;margin-bottom:10px}
.nm{font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.sub{opacity:.75;margin-top:4px}
.ttl{font-size:46px;letter-spacing:.3em;color:var(--ac);font-weight:500;text-align:right;margin:0}
.meta{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 24px;font-size:13px}.meta b{font-weight:600}.meta span{text-align:right}
.small{font-size:12px;opacity:.85;white-space:pre-line}
h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
table{width:100%;border-collapse:collapse;margin-top:4px}
th{background:var(--ac);color:var(--ah);padding:10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
td{border:1px solid var(--pl);padding:10px;vertical-align:top}.r{text-align:right}.c{text-align:center}
.tot{margin-left:auto;width:55%;margin-top:0}.tot td{padding:8px 10px}.tot tr:last-child td{font-size:18px;font-weight:700}
.pay{display:grid;grid-template-columns:110px 1fr;gap:2px 8px;font-size:12px}
.qr{display:flex;gap:14px;align-items:center;border:1px solid var(--pl);padding:12px;margin-top:14px;max-width:340px}
.qr img,.qr .ph{width:84px;height:84px;object-fit:contain;border:1px solid var(--pl);display:flex;align-items:center;justify-content:center;font-size:10px}
.ty{text-align:center;margin-top:24px;font-size:26px;font-style:italic;opacity:.85}
@media (max-width:860px){
 .app{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0}
 body.pv aside{display:none}body:not(.pv) main{display:none}
 main{padding:12px 0;overflow-x:hidden}
}
@media print{aside,.bar,.tabs{display:none!important}.app{display:block}main{display:block!important;padding:0}body{background:#fff}.paper{zoom:1!important;margin:0;width:794px}.pg{box-shadow:none;margin:0;height:1122px;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pg:last-child{break-after:auto;page-break-after:auto}@page{size:A4;margin:0}}
.tabs{display:none;position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);gap:8px;z-index:5}
.tabs button{flex:1}
@media (max-width:860px){.tabs{display:flex}body{padding-bottom:64px}}
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .4s}#splash.out{opacity:0;pointer-events:none}.sl{display:flex;flex-direction:column;align-items:center;gap:16px}.lg{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 10px 24px rgba(74,29,150,.35))}.st{font-size:22px;font-weight:600;letter-spacing:.04em;color:var(--ink);animation:up .5s .35s ease-out both}.tk{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .5s .7s ease-out forwards}@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes mp{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}.mdl>div{animation:mp .22s ease-out}@media (prefers-reduced-motion:reduce){#splash *,.mdl>div{animation:none!important}.tk{stroke-dashoffset:0}}@media print{#splash{display:none!important}}
</style>
